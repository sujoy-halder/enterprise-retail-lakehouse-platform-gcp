apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: retail-recommendation-api
  namespace: retail-lakehouse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: retail-recommendation-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65

