name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.10.5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt dbt-bigquery

      - name: Terraform format
        run: terraform fmt -check -recursive terraform

      - name: Terraform validate
        run: |
          terraform -chdir=terraform/envs/dev init -backend=false
          terraform -chdir=terraform/envs/dev validate

      - name: Python contract tests
        run: python -m pytest tests

      - name: Python lint
        run: python -m ruff check docker scripts spark databricks airflow tests

      - name: Python dependency audit
        run: |
          pip-audit -r docker/etl-service/requirements.txt
          pip-audit -r docker/recommendation-api/requirements.txt
          pip-audit -r requirements-dev.txt

      - name: dbt parse
        env:
          GCP_PROJECT_ID: validation-project
          DBT_TARGET: dev
          DBT_BRONZE_DATASET: retail_lakehouse_dev_bronze
          DBT_SILVER_DATASET: retail_lakehouse_dev_silver
          BIGQUERY_LOCATION: us-central1
        run: |
          cp dbt/retail_analytics/profiles.yml.example dbt/retail_analytics/profiles.yml
          cd dbt/retail_analytics
          dbt deps
          dbt parse --profiles-dir .

      - name: Docker build
        run: |
          docker build -f docker/etl-service/Dockerfile -t retail-etl-service:ci .
          docker build -f docker/recommendation-api/Dockerfile -t retail-recommendation-api:ci .
